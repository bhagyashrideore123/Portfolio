<section class="hero" id="hero">

        <div class="hero_detail">
            <div class="hero_row_align">
                <figure>

            </div>

            <div class="hero-text">
                <h1>Bhagyashri Deore</h1>
                <p>{{'hero.role'|translate}}</p>

            <a href="#why-me" aria-label="Scroll down">
