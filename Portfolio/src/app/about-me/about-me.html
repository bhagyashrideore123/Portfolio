<article class="aboutme">
<div class="aboutme_wrapper">
    <h2>Need a teamplayer? Here’s what my colleagues say about me</h2>

    <div class="aboutme_grid">
        @for (a of aboutmeData; track a.name) {
        <div class="aboutme_card">
            <div class="aboutme_content">
            <h3>{{ a.name }}</h3>
            <p class="aboutme_project">Project <span>{{ a.project }}</span></p>
            <blockquote>“{{ a.quote }}”</blockquote>
            <a [href]="a.linkedin" target="_blank" rel="noopener noreferrer">Linked In Profile</a>
            </div>
        </div>
        }
    </div>
</div>
</article>
